# Builds the Windows installer for a version tag (v1.2.3) and publishes it as a
# GitHub release, together with latest.json for the in-app updater.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Checkout leaves the tag lightweight; the annotated tag carries the release notes.
      - run: git fetch --force --tags

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Release notes from the tag message
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_END"
            git tag --list --format='%(contents)' "$GITHUB_REF_NAME"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed copies can trust it. See README, "Releases".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Rivet ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # The notes above also become the update dialog's "What's new", so the page
      # gets its download hint only now, after latest.json is written.
      - name: Say which file to download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            git tag --list --format='%(contents)' "$GITHUB_REF_NAME"
            echo
            echo "### Download"
            echo
            echo "Download **Rivet_${version}_x64-setup.exe** below and run it. Already have Rivet? It offers the update by itself."
            echo
            echo "The other files are for Rivet itself: \`latest.json\` tells installed copies that a new version is out, and the \`.sig\` file is the installer's signature they check before updating. GitHub adds the source code archives to every release."
          } > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
