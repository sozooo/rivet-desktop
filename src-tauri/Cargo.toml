[package]
name = "rivet"
version = "0.1.0"
description = "A Git client for artists and developers"
edition = "2024"
rust-version = "1.90"

[lib]
name = "rivet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
keyring = "4.2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
