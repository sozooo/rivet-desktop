[package]
name = "rivet"
version = "0.3.0"
description = "A Git client for artists and developers"
edition = "2024"
rust-version = "1.90"

[lib]
name = "rivet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = "4.2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
regex = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    # Finding Blender's windows (open_apps.rs).
    "Win32_UI_WindowsAndMessaging",
    # Cancelling a git command stops everything it started (process_tree.rs).
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
